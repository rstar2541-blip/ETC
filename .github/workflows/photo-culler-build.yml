name: Photo Culler 프로그램 빌드

on:
  push:
    paths:
      - 'photo-culler/**'
      - '.github/workflows/photo-culler-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: PhotoCuller-Windows
          - os: macos-latest
            artifact: PhotoCuller-macOS
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
        working-directory: photo-culler
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps mediapipe==1.2.2
          pip install -r requirements-build.txt

      - name: Download face models
        run: python -c "import photo_cull; photo_cull.ensure_models()"

      - name: Build
        run: pyinstaller --noconfirm photo_culler.spec

      - name: Make test photos
        run: |
          python - <<'EOF'
          import urllib.request
          from pathlib import Path
          import pillow_heif
          from PIL import Image, ImageFilter
          pillow_heif.register_heif_opener()
          d = Path("testdata/가족사진"); d.mkdir(parents=True, exist_ok=True)  # 한글 경로도 시험
          base = "https://storage.googleapis.com/mediapipe-assets/"
          for n in ("portrait.jpg", "business-person.png", "man-woman-okay.jpg"):
              urllib.request.urlretrieve(base + n, d / n)
          Image.open(d / "portrait.jpg").filter(ImageFilter.GaussianBlur(4)).save(d / "portrait_blur.jpg")
          Image.open(d / "business-person.png").convert("RGB").save(d / "business-person.heic")
          Image.new("RGB", (1080, 2340), "white").save(d / "Screenshot_20240101-101010_Instagram.jpg")
          print(sorted(p.name for p in d.iterdir()))
          EOF

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          # 한글 폴더에 풀어서 실행해 봄 (모델·썸네일이 한글 경로에서도 되는지)
          $app = Join-Path $env:RUNNER_TEMP "사진정리앱"
          Copy-Item -Recurse dist\PhotoCuller $app
          $p = Start-Process -FilePath "$app\PhotoCuller.exe" -ArgumentList '--selftest', "$PWD\testdata\가족사진", "$PWD\selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit $($p.ExitCode))" }

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          set +e
          app="$RUNNER_TEMP/사진정리앱"
          mkdir -p "$app" && cp -R dist/PhotoCuller.app "$app/"
          "$app/PhotoCuller.app/Contents/MacOS/PhotoCuller" --selftest "$PWD/testdata/가족사진" "$PWD/selftest.json"
          code=$?
          cat selftest.json
          exit $code

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: 7z a -tzip -mx=7 "../${{ matrix.artifact }}.zip" ./dist/PhotoCuller

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PhotoCuller.app "../${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: photo-culler-v1.0.${{ github.run_number }}
          name: 사진 정리 (Photo Culler) v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          body: |
            흐리거나, 눈을 감았거나, 표정이 어색한 사진을 골라 주는 프로그램이에요.
            분석은 내 컴퓨터에서만 이루어지고, 직접 지우기 전에는 사진을 옮기기만 해요(되돌리기 가능).

            ## 다운로드
            아래 **Assets** 에서 내 컴퓨터에 맞는 파일을 받으세요.

            **Windows 10/11** — `PhotoCuller-Windows.zip`
            1. 압축을 풀고 `PhotoCuller` 폴더 안의 **PhotoCuller.exe** 를 실행
            2. "Windows의 PC 보호" 창이 뜨면 **[추가 정보] → [실행]**

            **Mac (M1 이후 Apple 칩, macOS 14 이상)** — `PhotoCuller-macOS.zip`
            1. 압축을 풀고 **PhotoCuller.app** 을 응용 프로그램 폴더로 옮기기
            2. 처음 한 번은 앱을 **우클릭 → 열기**
            3. 그래도 "손상되었다"며 안 열리면 터미널에서 `xattr -cr /Applications/PhotoCuller.app` 한 번 실행

            ## 사용법
            1. **폴더 선택** (또는 창에 폴더를 끌어다 놓기) → 자동으로 분석 시작
            2. 불량 / 확인필요 / 연사중복 탭에서 사진을 확인하고, 판정이 틀리면 버튼이나 **숫자키 1~4** 로 바꾸기
            3. 필요 없는 사진은 **Del 키**로 바로 삭제 (휴지통으로 가서 복원 가능. 여러 장 선택하면 한 번 확인)
               스크린샷은 **스크린샷 탭**에 따로 모아 보여 줘요
            4. **정리하기** → 사진 폴더 안 `_사진정리` 폴더로 분류해서 옮김 (**되돌리기** 가능)
