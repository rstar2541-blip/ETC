name: Trend Writer APK

on:
  push:
    paths:
      - 'trend-writer/**'
      - '.github/workflows/trend-writer-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: store your own key as the TW_KEYSTORE_BASE64 secret (plus passwords) to sign with it instead.
      - name: Use private signing key if configured
        env:
          KS: ${{ secrets.TW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TW_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: trend-writer/android
        env:
          TW_KEYSTORE_PASSWORD: ${{ secrets.TW_KEYSTORE_PASSWORD }}
          TW_KEY_ALIAS: ${{ secrets.TW_KEY_ALIAS }}
          TW_KEY_PASSWORD: ${{ secrets.TW_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp trend-writer/android/app/build/outputs/apk/release/app-release.apk "trend-writer-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: trend-writer-apk
          path: trend-writer-v1.0.*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: trend-writer-v1.0.${{ github.run_number }}
          name: 트렌드 라이터 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: trend-writer-v1.0.*.apk
          body: |
            안드로이드 폰에서 아래 Assets의 `.apk` 파일을 받아 설치하세요.
            처음 설치할 때 "출처를 알 수 없는 앱 설치"를 허용해야 할 수 있어요.
            새 버전은 기존 앱 위에 덮어 설치되고, 저장한 키와 기록은 그대로 유지돼요.
