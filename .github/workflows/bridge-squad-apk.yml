name: Bridge Squad APK

on:
  push:
    paths:
      - 'bridge-squad/**'
      - '.github/workflows/bridge-squad-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Optional: store your own key as the BS_KEYSTORE_BASE64 secret (plus passwords) to sign with it instead.
      - name: Use private signing key if configured
        env:
          KS: ${{ secrets.BS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: bridge-squad/android
        env:
          BS_KEYSTORE_PASSWORD: ${{ secrets.BS_KEYSTORE_PASSWORD }}
          BS_KEY_ALIAS: ${{ secrets.BS_KEY_ALIAS }}
          BS_KEY_PASSWORD: ${{ secrets.BS_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp bridge-squad/android/app/build/outputs/apk/release/app-release.apk "bridge-squad-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-squad-apk
          path: bridge-squad-v1.0.*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bridge-squad-v1.0.${{ github.run_number }}
          name: 브릿지 스쿼드 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: bridge-squad-v1.0.*.apk
          body: |
            안드로이드 폰에서 아래 Assets의 `.apk` 파일을 받아 설치하세요.
            처음 설치할 때 "출처를 알 수 없는 앱 설치"를 허용해야 할 수 있어요.
            새 버전은 기존 앱 위에 덮어 설치되고, 스테이지 저장은 그대로 유지돼요.
